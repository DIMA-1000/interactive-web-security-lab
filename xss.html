<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'self'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XSS Lab | Web Security Lab</title>

<link rel="stylesheet" href="assets/xss-0.css">
<link rel="stylesheet" href="assets/offline.css">
<script src="assets/offline.js" defer></script>
<script src="assets/language.js" defer></script>
</head>

<body>

<div class="container">

<a href="index.html">← Back to Security Lab</a>

<h1>Cross-Site Scripting (XSS)</h1>

<p>
Interactive demonstration of unsafe HTML rendering
and a safer alternative.
</p>

<div class="lab">

<h2>Test Input</h2>

<label for="userInput"><strong>HTML test input</strong></label>

<input
    id="userInput"
    type="text"
    value="<b>Security Test</b>"
    placeholder="Enter test HTML"
    autocomplete="off"
    aria-describedby="inputHelp"
>

<p id="inputHelp">
The vulnerable example renders the supplied HTML inside an isolated sandbox.
</p>

<div class="buttons">

<button type="button" class="vulnerable" id="action-0">
🔓 Run Vulnerable
</button>

<button type="button" class="safe" id="action-1">
🛡 Run Protected
</button>

</div>

<div id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>

<h3>Application Output</h3>

<div id="output" class="output" role="region" aria-label="Application output" aria-live="polite">
Waiting for test...
</div>

</div>

</div>

<script src="assets/xss-0.js" defer></script>

</body>
</html>
