<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XSS Lab | Web Security Lab</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 40px 20px;
}

a {
    color: #58a6ff;
}

.lab {
    background: #151b23;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 25px;
    margin-top: 25px;
}

input {
    width: 95%;
    padding: 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    color: white;
    border-radius: 6px;
    margin: 10px 0;
    font-size: 16px;
}

.buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

button {
    padding: 14px 24px;
    border-radius: 7px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button.vulnerable {
    background: #da3633 !important;
    border: 2px solid #f85149 !important;
    color: #ffffff !important;
}

button.safe {
    background: #238636 !important;
    border: 2px solid #3fb950 !important;
    color: #ffffff !important;
}

.status {
    margin-top: 25px;
    padding: 20px;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.5;
    display: none;
}

.status.bad {
    display: block;
    background: #2d1215 !important;
    border: 2px solid #f85149 !important;
    color: #ffffff;
}

.status.good {
    display: block;
    background: #10261a !important;
    border: 2px solid #3fb950 !important;
    color: #ffffff;
}

.output {
    background: #0d1117;
    border: 1px solid #30363d;
    padding: 18px;
    margin-top: 20px;
    min-height: 80px;
    border-radius: 6px;
    font-size: 17px;
}
</style>
</head>

<body>

<div class="container">

<a href="index.html">← Back to Security Lab</a>

<h1>Cross-Site Scripting (XSS)</h1>

<p>
Interactive demonstration of unsafe HTML rendering
and a safer alternative.
</p>

<div class="lab">

<h2>Test Input</h2>

<input
    id="userInput"
    value="<b>Security Test</b>"
    placeholder="Enter test HTML"
>

<div class="buttons">

<button class="vulnerable" onclick="runVulnerable()">
🔓 Run Vulnerable
</button>

<button class="safe" onclick="runSafe()">
🛡 Run Protected
</button>

</div>

<div id="status" class="status"></div>

<h3>Application Output</h3>

<div id="output" class="output">
Waiting for test...
</div>

</div>

</div>

<script>

function runVulnerable() {

    const input = document.getElementById("userInput").value;
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    output.innerHTML = input;

    status.className = "status bad";

    status.textContent =
`🔴 VULNERABLE — UNSAFE HTML RENDERING

User input was interpreted as HTML.

The application inserted untrusted input directly into the page using innerHTML.

SECURITY ISSUE:
HTML supplied by the user was rendered by the browser.`;
}

function runSafe() {

    const input = document.getElementById("userInput").value;
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    output.textContent = input;

    status.className = "status good";

    status.textContent =
`🟢 PROTECTED — SAFE TEXT RENDERING

User input was rendered as text.

The application treated the supplied value as data instead of HTML.

PROTECTION:
The browser did not interpret the user input as HTML.`;
}

</script>

</body>
</html>
